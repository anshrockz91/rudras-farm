<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rudra's Farm</title>
<meta name="description" content="A happy idle farm game. Tap, collect, sell and grow your farm!">
<meta name="theme-color" content="#5cc45c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rudra's Farm">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="profBtn" class="round prof" aria-label="Profile"><span id="profAv">🧒</span><i id="syncDot">🔄</i></button>
  <div id="coinPill" class="pill"><span id="coinWorld">🚜</span><span>💰</span><b id="coins">0</b></div>
  <button id="starBtn" class="pill" aria-label="Stars"><span>⭐</span><b id="stars">0</b></button>
  <button id="setBtn" class="round" aria-label="Settings">⚙️</button>
</header>
<main>
  <nav id="navbar" class="navbar"></nav>
  <button id="quest" class="quest hidden" aria-label="Current quest"></button>
</main>
<div id="mapview"><div id="mapworld"></div><div id="mapbannerHost"></div></div>
<div id="laneView" class="hidden"><div class="lvbar"><button id="lvBack" class="navback">⬅️</button><span id="lvTitle"></span></div><div id="lanes"></div></div>
<div id="timePill" class="timepill hidden"></div>
<div id="lock" class="hidden"></div>
<div id="dlg" class="hidden"></div>
<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>
<div id="celebrate" class="hidden"></div>
<canvas id="confetti"></canvas>
<script>if (/[?&]sandbox=1(&|$)/.test(location.search)) window.RF_SANDBOX = true; // admin test sandbox (see admin.html)</script>
<script src="story.js"></script>
<script src="game.js"></script>
</body>
</html>
